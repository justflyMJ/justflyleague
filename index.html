<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛行日常無人機足球聯賽 | 官方戰績與賽事查詢系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a365d;
            --accent-blue: #2b6cb0;
            --light-bg: #f8fafc;
        }
        body {
            background-color: var(--light-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            color: #2d3748;
        }
        .hero-banner {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            color: white;
            padding: 2.5rem 1rem;
            border-radius: 0 0 1.5rem 1.5rem;
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.15);
            margin-bottom: 2rem;
        }
        .league-logo {
            width: 120px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            background: white;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .card-header {
            background-color: var(--primary-blue);
            color: white;
            font-weight: 700;
            padding: 1rem 1.25rem;
            border: none;
        }
        .nav-pills .nav-link {
            color: var(--primary-blue);
            font-weight: 600;
            border-radius: 2rem;
            padding: 0.6rem 1.5rem;
            margin: 0 0.25rem;
            transition: all 0.2s ease;
        }
        .nav-pills .nav-link.active {
            background-color: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 8px rgba(26, 54, 93, 0.2);
        }
        .table th {
            background-color: #edf2f7;
            color: #2d3748;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .table td {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- 頂部 Header 加上 Logo (置中對齊) -->
    <div class="hero-banner text-center">
        <div class="container d-flex flex-column align-items-center justify-content-center">
            <img src="images/logo.png" alt="飛行日常 Logo" class="league-logo mx-auto d-block mb-3" id="dynamic-logo">
            <h1 class="fw-bold mb-2">飛行日常無人機足球聯賽</h1>
            <p class="lead mb-0 opacity-90">官方戰績積分排行榜 · 賽事對戰紀錄 · 歷史對戰淨得分查詢</p>
        </div>
    </div>

    <div class="container pb-5">

        <!-- 資料庫同步狀態 -->
        <div class="card mb-4 bg-white border-start border-4 border-primary">
            <div class="card-body p-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div class="d-flex align-items-center">
                    <i class="fas fa-link text-primary fs-4 me-3"></i>
                    <div>
                        <strong class="d-block">Google Sheet 資料庫同步</strong>
                        <small class="text-muted" id="sync-status">載入中...</small>
                    </div>
                </div>
                <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="loadAllData()">
                    <i class="fas fa-sync-alt me-1"></i> 重新整理
                </button>
            </div>
        </div>

        <!-- 頁籤按鈕 -->
        <ul class="nav nav-pills justify-content-center mb-4" id="mainTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="leaderboard-tab" data-bs-toggle="pill" data-bs-target="#tab-leaderboard" type="button">
                    <i class="fas fa-trophy me-1"></i> 積分排行榜
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="matches-tab" data-bs-toggle="pill" data-bs-target="#tab-matches" type="button">
                    <i class="fas fa-gamepad me-1"></i> 賽事對戰紀錄
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="h2h-tab" data-bs-toggle="pill" data-bs-target="#tab-h2h" type="button">
                    <i class="fas fa-balance-scale me-1"></i> 歷史對戰淨得分
                </button>
            </li>
        </ul>

        <!-- 分頁內容 -->
        <div class="tab-content" id="mainTabContent">

            <!-- 1. 積分排行榜 -->
            <div class="tab-pane fade show active" id="tab-leaderboard" role="tabpanel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-trophy me-2"></i>聯賽積分排行榜與淨得分統計</span>
                        <span class="badge bg-light text-dark">Official Leaderboard</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>隊伍編號</th>
                                        <th class="text-start">隊伍名稱</th>
                                        <th>已賽</th>
                                        <th>勝/平/敗</th>
                                        <th>淨勝球</th>
                                        <th>總進球</th>
                                        <th>淨負球</th>
                                        <th>總積分</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-leaderboard">
                                    <tr><td colspan="9" class="py-4 text-muted">讀取中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 賽事對戰紀錄 -->
            <div class="tab-pane fade" id="tab-matches" role="tabpanel">
                <div class="card">
                    <div class="card-header"><i class="fas fa-list-ol me-2"></i>賽事對戰紀錄表</div>
                    <div class="card-body p-0">
                        <div class="p-3 border-bottom d-flex flex-wrap align-items-center gap-2">
                            <label for="select-match-date" class="fw-bold mb-0"><i class="far fa-calendar-alt me-1"></i>選擇比賽日期</label>
                            <select id="select-match-date" class="form-select w-auto">
                                <option value="">全部日期</option>
                            </select>
                            <small class="text-muted ms-md-2" id="match-count-text"></small>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead>
                                    <tr>
                                        <th>比賽日期</th>
                                        <th>場次</th>
                                        <th>主隊名稱</th>
                                        <th>客隊名稱</th>
                                        <th>比賽比分</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-matches">
                                    <tr><td colspan="5" class="py-4 text-muted">讀取中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 歷史對戰淨得分查詢 -->
            <div class="tab-pane fade" id="tab-h2h" role="tabpanel">
                <div class="card">
                    <div class="card-header"><i class="fas fa-search me-2"></i>兩隊對戰歷史淨得分與讓分參考查詢</div>
                    <div class="card-body p-4">
                        <div class="row g-3 align-items-center mb-4">
                            <div class="col-md-5">
                                <label class="form-label fw-bold">隊伍 A (強隊/主)</label>
                                <select id="select-team-a" class="form-select form-select-lg"><option value="">-- 請選擇隊伍 A --</option></select>
                            </div>
                            <div class="col-md-2 text-center fs-3 fw-bold text-muted">VS</div>
                            <div class="col-md-5">
                                <label class="form-label fw-bold">隊伍 B (弱隊/客)</label>
                                <select id="select-team-b" class="form-select form-select-lg"><option value="">-- 請選擇隊伍 B --</option></select>
                            </div>
                        </div>
                        <div class="text-center">
                            <button class="btn btn-primary btn-lg px-5 fw-bold rounded-pill" onclick="calculateH2H()">
                                <i class="fas fa-calculator me-2"></i>計算對戰淨得分與建議讓分
                            </button>
                        </div>

                        <hr class="my-4">

                        <div id="h2h-result-box" class="p-4 text-center rounded-3 bg-light d-none">
                            <h4 class="fw-bold mb-3" id="h2h-title">對戰數據分析</h4>
                            <div class="row g-3 my-2">
                                <div class="col-md-4">
                                    <div class="p-3 bg-white rounded shadow-sm">
                                        <small class="text-muted d-block">交手場次</small>
                                        <span class="fs-3 fw-bold text-primary" id="h2h-count">0</span> 場
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="p-3 bg-white rounded shadow-sm">
                                        <small class="text-muted d-block">歷史總淨得分差 (ΔD)</small>
                                        <span class="fs-3 fw-bold text-success" id="h2h-net-diff">0.0</span> 分
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="p-3 bg-white rounded shadow-sm">
                                        <small class="text-muted d-block">建議開局讓分</small>
                                        <span class="fs-3 fw-bold text-danger" id="h2h-handicap">0</span> 分
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 頁尾:管理員入口 -->
    <footer class="text-center pb-4">
        <a href="admin.html" class="text-muted small text-decoration-none">
            <i class="fas fa-lock me-1"></i>賽事管理後台
        </a>
    </footer>

    <!-- JavaScript & Google Sheet API 自動連線邏輯 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        // 後台網址:優先用 config.js 的設定;讀不到 config.js 時,使用這個內建的預設網址
        const DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzusArIYnwmyuoZvj_K0gNP4jGwzfntws4lYe7w5B-PRlCHpptbTORNqoSOuxVyQMoDPQ/exec";
        const API_URL = (typeof APPS_SCRIPT_URL !== "undefined" && String(APPS_SCRIPT_URL).indexOf("http") === 0)
            ? APPS_SCRIPT_URL : DEFAULT_APPS_SCRIPT_URL;

        // 預設的試算表 ID。實際使用的 ID 以後台「系統設定」為準(向 Apps Script 詢問),
        // 只有連不上後台時才會退回使用這個預設值。
        const DEFAULT_SPREADSHEET_ID = "1CJHuNycTsr2Mou6ThGYIr-cuP6qGfCY6pA0JNsFvIqY";
        let SPREADSHEET_ID = DEFAULT_SPREADSHEET_ID;
        let LEADERBOARD_CSV_URL = "";
        let TEAMS_CSV_URL = "";
        let remoteSheetNames = null;   // 後台回報的日期分頁;null 代表沒有問到

        function applySpreadsheetId(id) {
            SPREADSHEET_ID = id;
            const base = "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:csv&sheet=";
            LEADERBOARD_CSV_URL = base + "Leaderboard";
            TEAMS_CSV_URL = base + "Teams";
        }
        applySpreadsheetId(DEFAULT_SPREADSHEET_ID);

        // 向後台詢問目前的試算表 ID 與日期分頁;失敗就維持預設值
        async function loadRemoteConfig() {
            remoteSheetNames = null;
            if (typeof API_URL === 'undefined' || API_URL.indexOf('http') !== 0) return;
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 10000);
            try {
                const res = await fetch(API_URL + "?action=config", { signal: ctrl.signal });
                const data = await res.json();
                if (data && data.sheetId) applySpreadsheetId(data.sheetId);
                if (data && data.ok && Array.isArray(data.sheets)) remoteSheetNames = data.sheets.map(String);
            } catch (e) {
                console.log("無法向後台取得設定,使用預設試算表", e);
            } finally {
                clearTimeout(timer);
            }
        }
        
        const MATCH_SHEETS = ["1025"]; 

        let globalMatches = [];
        let globalTeams = [];
        let leaderboardData = null;   // 排行榜原始資料,隊伍名單載入後會再畫一次以帶入隊伍編號

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            return lines.map(line => {
                const values = [];
                let insideQuote = false;
                let currentVal = '';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        values.push(currentVal.trim().replace(/^"|"$/g, ''));
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                values.push(currentVal.trim().replace(/^"|"$/g, ''));
                return values;
            });
        }

        // 讀取 CSV,並檢查是否真的拿到資料(未公開的試算表會回傳登入頁 HTML)
        async function fetchCsv(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            if (/^\s*<(!doctype|html)/i.test(text)) {
                throw new Error("試算表未公開,讀到的是登入頁面");
            }
            return text;
        }

        async function loadAllData() {
            document.getElementById('sync-status').innerText = "正在讀取最新戰績資料...";
            try {
                await loadRemoteConfig();
                await Promise.all([fetchLeaderboard(), fetchMatches(), fetchTeams()]);
                document.getElementById('sync-status').innerText = "資料已完成同步！(" + new Date().toLocaleTimeString() + ")";
            } catch (err) {
                console.error(err);
                document.getElementById('sync-status').innerText =
                    "無法讀取 Google Sheet(" + err.message + "),請確認試算表已開啟「知道連結的任何人可檢視」,並且是用網址開啟頁面";
            }
        }

        async function fetchLeaderboard() {
            const text = await fetchCsv(LEADERBOARD_CSV_URL);
            leaderboardData = parseCSV(text);
            renderLeaderboard(leaderboardData);
        }

        // 分頁名稱(例如 1025)轉成日期文字(10月25日)
        function formatSheetDate(name) {
            const n = String(name).trim();
            if (/^\d{4}$/.test(n)) return parseInt(n.slice(0, 2), 10) + "月" + parseInt(n.slice(2), 10) + "日";
            if (/^\d{3}$/.test(n)) return parseInt(n.slice(0, 1), 10) + "月" + parseInt(n.slice(1), 10) + "日";
            return n;
        }

        // 取得所有日期分頁:有問到後台就以後台為準(新增的比賽日會自動出現,換試算表也不會讀錯),
        // 問不到才用 MATCH_SHEETS 的預設清單
        async function discoverSheets() {
            const names = remoteSheetNames !== null ? remoteSheetNames : MATCH_SHEETS;
            return Array.from(new Set(names)).sort((a, b) => Number(a) - Number(b));
        }

        async function fetchMatches() {
            globalMatches = [];
            const sheetNames = await discoverSheets();
            const results = await Promise.all(sheetNames.map(async sheetName => {
                try {
                    const url = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + sheetName;
                    const rows = parseCSV(await fetchCsv(url));
                    const list = [];
                    for (let i = 1; i < rows.length; i++) {
                        if (rows[i] && rows[i].length >= 9 && (rows[i][3] || rows[i][5])) {
                            list.push({
                                sheet: sheetName,
                                date: rows[i][0] || formatSheetDate(sheetName),
                                matchNo: rows[i][1],
                                homeName: rows[i][3],
                                awayName: rows[i][5],
                                homeScore: rows[i][7],
                                awayScore: rows[i][8]
                            });
                        }
                    }
                    return list;
                } catch (e) {
                    console.log("載入分頁失敗: " + sheetName, e);
                    return [];
                }
            }));
            results.forEach(list => globalMatches.push(...list));
            populateDateFilter(sheetNames);
            applyMatchFilter();
        }

        function populateDateFilter(sheetNames) {
            const sel = document.getElementById('select-match-date');
            const keep = sel.value;
            sel.innerHTML = '';
            const all = document.createElement('option');
            all.value = '';
            all.textContent = '全部日期';
            sel.appendChild(all);
            // 最新的日期排在前面
            sheetNames.slice().reverse().forEach(name => {
                const o = document.createElement('option');
                o.value = name;
                o.textContent = formatSheetDate(name);
                sel.appendChild(o);
            });
            sel.value = sheetNames.includes(keep) ? keep : '';
        }

        function applyMatchFilter() {
            const chosen = document.getElementById('select-match-date').value;
            const list = chosen ? globalMatches.filter(m => m.sheet === chosen) : globalMatches;
            renderMatches(list);
            document.getElementById('match-count-text').textContent = "共 " + list.length + " 場";
        }

        async function fetchTeams() {
            const text = await fetchCsv(TEAMS_CSV_URL);
            const rows = parseCSV(text);
            globalTeams = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i] && rows[i][1]) {
                    globalTeams.push({
                        id: rows[i][0],
                        name: rows[i][1]
                    });
                }
            }
            populateTeamDropdowns(globalTeams);
            if (leaderboardData) renderLeaderboard(leaderboardData);   // 帶入隊伍編號
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('tbody-leaderboard');
            tbody.innerHTML = '';
            
            // 隊伍名稱 → 隊伍編號(來自 Teams 分頁)
            const idByName = {};
            globalTeams.forEach(t => { idByName[String(t.name).trim()] = t.id; });

            let teamsList = [];
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || !row[1]) continue;
                teamsList.push({
                    id: idByName[String(row[2]).trim()] || '-',
                    name: row[2],  
                    played: parseInt(row[3]) || 0, 
                    win: parseInt(row[4]) || 0,    
                    draw: parseInt(row[5]) || 0,   
                    loss: parseInt(row[6]) || 0,   
                    gf: parseInt(row[7]) || 0,     // 總進球
                    ga: parseInt(row[8]) || 0,     // 淨負球 (原總失球欄位)
                    net: parseInt(row[9]) || 0,    // 淨勝球 (原淨得分欄位)
                    totalPts: parseInt(row[10]) || 0 
                });
            }

            teamsList.sort((a, b) => b.totalPts - a.totalPts);

            teamsList.forEach((t, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${idx + 1}</td>
                        <td><span class="badge bg-secondary">${t.id}</span></td>
                        <td class="text-start fw-bold">${t.name}</td>
                        <td>${t.played}</td>
                        <td><small class="text-muted">${t.win}/${t.draw}/${t.loss}</small></td>
                        <td class="fw-bold ${t.net>=0?'text-success':'text-danger'}">${t.net}</td>
                        <td>${t.gf}</td>
                        <td>${t.ga}</td>
                        <td><span class="badge bg-primary px-2 fs-6">${t.totalPts}</span></td>
                    </tr>`;
            });

            if (!tbody.innerHTML) tbody.innerHTML = '<tr><td colspan="9" class="text-muted py-4">尚無隊伍積分資料</td></tr>';
        }

        document.getElementById('select-match-date').addEventListener('change', applyMatchFilter);

        function renderMatches(matches) {
            const tbody = document.getElementById('tbody-matches');
            tbody.innerHTML = '';
            matches.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td><small class="text-muted">${m.date}</small></td>
                        <td>第 ${m.matchNo} 場</td>
                        <td class="fw-bold">${m.homeName}</td>
                        <td class="fw-bold">${m.awayName}</td>
                        <td><span class="badge bg-secondary fs-6">${m.homeScore} : ${m.awayScore}</span></td>
                    </tr>`;
            });
            if (!tbody.innerHTML) tbody.innerHTML = '<tr><td colspan="5" class="text-muted py-4">尚無賽事戰績紀錄</td></tr>';
        }

        function populateTeamDropdowns(teams) {
            const selA = document.getElementById('select-team-a');
            const selB = document.getElementById('select-team-b');
            selA.innerHTML = '<option value="">-- 請選擇隊伍 A --</option>';
            selB.innerHTML = '<option value="">-- 請選擇隊伍 B --</option>';
            teams.forEach(t => {
                selA.innerHTML += '<option value="' + t.name + '">' + t.name + '</option>';
                selB.innerHTML += '<option value="' + t.name + '">' + t.name + '</option>';
            });
        }

        function calculateH2H() {
            const teamA = document.getElementById('select-team-a').value;
            const teamB = document.getElementById('select-team-b').value;
            if (!teamA || !teamB || teamA === teamB) { alert("請選擇兩支不同的隊伍！"); return; }

            let count = 0, netDiff = 0;
            globalMatches.forEach(m => {
                const hScore = parseInt(m.homeScore) || 0;
                const aScore = parseInt(m.awayScore) || 0;
                if (m.homeName === teamA && m.awayName === teamB) {
                    count++;
                    netDiff += (hScore - aScore);
                } else if (m.homeName === teamB && m.awayName === teamA) {
                    count++;
                    netDiff += (aScore - hScore);
                }
            });

            let handicap = 0;
            const absDiff = Math.abs(netDiff);
            if (absDiff >= 15) handicap = 15;
            else if (absDiff >= 10) handicap = 10;
            else if (absDiff >= 5) handicap = 5;
            else handicap = 0;

            document.getElementById('h2h-title').innerText = teamA + " 對戰 " + teamB + " 數據分析";
            document.getElementById('h2h-count').innerText = count;
            document.getElementById('h2h-net-diff').innerText = netDiff.toFixed(1);
            document.getElementById('h2h-handicap').innerText = handicap + " 分";
            document.getElementById('h2h-result-box').classList.remove('d-none');
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
