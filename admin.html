<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>管理員登入 | 飛行日常無人機足球聯賽</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #1a365d; --accent-blue: #2b6cb0; --light-bg: #f8fafc; }
        body {
            background-color: var(--light-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            color: #2d3748;
        }
        .hero-banner {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            color: white;
            padding: 1.75rem 1rem;
            border-radius: 0 0 1.5rem 1.5rem;
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.15);
            margin-bottom: 2rem;
        }
        .league-logo { width: 80px; height: auto; border-radius: 12px; background: white; padding: 5px; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { background-color: var(--primary-blue); color: white; font-weight: 700; padding: 1rem 1.25rem; border: none; }
        #login-box { max-width: 420px; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="hero-banner text-center">
        <div class="container d-flex flex-column align-items-center">
            <img src="images/logo.png" alt="飛行日常 Logo" class="league-logo mb-2">
            <h1 class="h3 fw-bold mb-1">賽事管理後台</h1>
            <p class="mb-0 opacity-90">僅限賽事管理人員使用</p>
        </div>
    </div>

    <div class="container pb-5">
        <div id="login-box" class="card">
            <div class="card-header"><i class="fas fa-lock me-2"></i>管理員登入</div>
            <div class="card-body p-4">
                <label for="user-input" class="form-label fw-bold">帳號</label>
                <input type="text" id="user-input" class="form-control form-control-lg mb-3" autocomplete="username">
                <label for="password-input" class="form-label fw-bold">密碼</label>
                <input type="password" id="password-input" class="form-control form-control-lg mb-3" autocomplete="current-password">
                <div id="login-error" class="text-danger small mb-3 d-none"></div>
                <button id="login-btn" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold">登入</button>
                <div class="text-center mt-3"><a href="index.html" class="small text-muted">回到戰績首頁</a></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const DASHBOARD_URL = "dashboard.html";

        async function callLogin(user, password) {
            // 使用 text/plain 可避免瀏覽器跨網域預檢,Apps Script 才收得到
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', user, password })
            });
            return res.json();
        }

        function showError(text) {
            $('login-error').textContent = text;
            $('login-error').classList.remove('d-none');
        }

        async function login() {
            const user = $('user-input').value.trim();
            const pw = $('password-input').value;
            if (!user || !pw) return showError('請輸入帳號與密碼');
            if (typeof APPS_SCRIPT_URL === 'undefined' || APPS_SCRIPT_URL.indexOf('http') !== 0) {
                return showError('尚未設定 APPS_SCRIPT_URL,請先編輯 config.js。');
            }
            $('login-btn').disabled = true;
            $('login-error').classList.add('d-none');
            try {
                const r = await callLogin(user, pw);
                if (r.ok) {
                    sessionStorage.setItem('adminUser', user);
                    sessionStorage.setItem('adminPw', pw);
                    location.href = DASHBOARD_URL;      // 登入成功,跳到管理頁面
                    return;
                }
                showError(r.error || '登入失敗');
            } catch (e) {
                showError('無法連線到後台服務,請檢查 config.js 的網址與 Apps Script 部署權限。');
            }
            $('login-btn').disabled = false;
        }

        $('user-input').value = 'admin';
        $('login-btn').addEventListener('click', login);
        $('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        $('user-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

        // 同一個瀏覽器分頁已登入過,就直接進管理頁面
        if (sessionStorage.getItem('adminPw') && typeof APPS_SCRIPT_URL !== 'undefined' && APPS_SCRIPT_URL.indexOf('http') === 0) {
            callLogin(sessionStorage.getItem('adminUser') || '', sessionStorage.getItem('adminPw'))
                .then(r => { if (r.ok) location.href = DASHBOARD_URL; })
                .catch(() => {});
        }
    </script>
</body>
</html>
